<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Muhammadi Cloth House | Ladies & Gents Unstitched Suits</title>
<meta name="description" content="Buy ladies and gents unstitched suits online. Lawn, cotton, khaddar, wash & wear. Cash on delivery all over Pakistan.">
<meta name="theme-color" content="#7a1230">
<style>
:root{--maroon:#7a1230;--gold:#c9a86a;--bg:#fffaf5;--text:#2b2b2b;--muted:#6b7280;--card:#ffffff;--border:#f0e6dc;--radius:18px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Urdu,Noto Nastaliq Urdu;background:var(--bg);color:var(--text);line-height:1.5}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
header{position:sticky;top:0;z-index:50;background:rgba(255,250,245,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.nav{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.logo{font-weight:900;font-size:22px;color:var(--maroon);letter-spacing:.5px}
.logo span{color:var(--gold)}
.btn{background:var(--maroon);color:#fff;padding:10px 18px;border-radius:999px;border:0;font-weight:700;cursor:pointer}
.btn.ghost{background:#fff;color:var(--maroon);border:1px solid var(--maroon)}
.hero{max-width:1200px;margin:18px auto;padding:0 16px;display:grid;gap:16px}
.slider{position:relative;border-radius:var(--radius);overflow:hidden;height:380px;background:#eee}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .6s}
.slide.active{opacity:1}
.slide img{width:100%;height:100%;object-fit:cover}
.slider .dots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.6);cursor:pointer}
.dot.active{background:#fff}
.filters{max-width:1200px;margin:10px auto;padding:0 16px;display:flex;gap:10px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:999px;background:#fff;border:1px solid var(--border);cursor:pointer;font-weight:600}
.chip.active{background:var(--maroon);color:#fff;border-color:var(--maroon)}
.grid{max-width:1200px;margin:10px auto 90px;padding:0 16px;display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}.slider{height:460px}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.card .pic{aspect-ratio:4/5;background:#f7f1eb;overflow:hidden;position:relative}
.card .pic img{width:100%;height:100%;object-fit:cover}
.card .info{padding:10px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.price{display:flex;gap:8px;align-items:center;font-weight:800}
.price s{color:var(--muted);font-weight:500;font-size:13px}
.badge{position:absolute;top:10px;left:10px;background:var(--gold);color:#3a2500;font-size:11px;padding:4px 8px;border-radius:999px;font-weight:800}
.cartBar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;z-index:60}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:80}
.modal.open{display:flex}
.sheet{background:#fff;width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #f3f3f3}
.input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:12px;margin-top:6px}
label{font-size:13px;font-weight:700;margin-top:10px;display:block}
</style>
</head>
<body>
<header>
<div class="nav">
<div class="logo">MUHAMMADI <span>CLOTH HOUSE</span></div>
<button class="btn" onclick="openCart()">Cart (<span id="cCount">0</span>)</button>
</div>
</header>

<div class="hero">
<div class="slider" id="slider"></div>
<h2 style="font-size:20px">Ladies & Gents Collection - Cash on Delivery All Pakistan</h2>
</div>

<div class="filters" id="filters">
<div class="chip active" data-f="All" onclick="setFilter(this,'All')">All</div>
<div class="chip" data-f="Gents" onclick="setFilter(this,'Gents')">Gents</div>
<div class="chip" data-f="Ladies" onclick="setFilter(this,'Ladies')">Ladies</div>
<div class="chip" data-f="Lawn" onclick="setFilter(this,'Lawn')">Lawn</div>
<div class="chip" data-f="Wash & Wear" onclick="setFilter(this,'Wash & Wear')">Wash & Wear</div>
<div class="chip" data-f="Khaddar" onclick="setFilter(this,'Khaddar')">Khaddar</div>
</div>

<div class="grid" id="grid"></div>

<div class="cartBar">
<div><b id="cTotal">Rs 0</b> <small style="color:#666">- <span id="cItems">0 items</span></small></div>
<button class="btn" onclick="openCart()">Checkout</button>
</div>

<div class="modal" id="cartModal" onclick="if(event.target==this)closeCart()">
<div class="sheet">
<div style="display:flex;justify-content:space-between;align-items:center"><h3>Your Cart</h3><button class="btn ghost" onclick="closeCart()">Close</button></div>
<div id="cartList" style="margin-top:12px"></div>
<div style="margin-top:16px">
<label>Your Name</label><input id="custName" class="input" placeholder="Muhammad Ali">
<label>Phone Number</label><input id="custPhone" class="input" placeholder="03XX-XXXXXXX">
<label>City & Full Address</label><textarea id="custAddr" class="input" placeholder="House, Street, City"></textarea>
<button class="btn" style="width:100%;margin-top:16px;padding:14px" onclick="placeOrder()">Order on WhatsApp</button>
<p style="text-align:center;color:#666;font-size:12px;margin-top:8px">Cash on Delivery - All over Pakistan</p>
</div>
</div>
</div>

<script>
var IMG_VER="v2";
var SLIDES=["slide1.jpg","slide2.jpg","slide3.jpg","slide4.jpg"];
var P=[
{id:5,img:"p1.jpg",n:"Premium Wash & Wear - Black",c:"Gents",f:"Wash & Wear",p:3190,o:3590,pc:"",a:"#a8b08a",b:"#555e36"},
{id:6,img:"p2.jpg",n:"Premium Wash & Wear - Dark Blue",c:"Gents",f:"Wash & Wear",p:3190,o:3590,pc:"",a:"#a8b08a",b:"#555e36"},
{id:7,img:"p3.jpg",n:"Premium Wash & Wear - Grey",c:"Gents",f:"Wash & Wear",p:2790,o:3290,pc:"",a:"#555",b:"#111"},
{id:8,img:"p4.jpg",n:"Premium Wash & Wear - Off White",c:"Gents",f:"Wash & Wear",p:2790,o:3290,pc:"",a:"#555",b:"#111"},
{id:9,img:"p5.jpg",n:"Premium Wash & Wear - White",c:"Gents",f:"Wash & Wear",p:3190,o:3590,pc:"",a:"#a8b08a",b:"#555e36"},
{id:10,img:"p6.jpg",n:"Premium Wash & Wear - Dark Grey",c:"Gents",f:"Wash & Wear",p:2790,o:3290,pc:"",a:"#555",b:"#111"},
{id:11,img:"p7.jpg",n:"Premium Wash & Wear - Mustard",c:"Gents",f:"Wash & Wear",p:3190,o:3590,pc:"",a:"#a8b08a",b:"#555e36"},
{id:1,img:"p8.jpg",n:"Floral Printed Lawn 3-Piece",c:"Ladies",f:"Lawn",p:3490,o:4290,pc:"3 Piece",a:"#e8a0b4",b:"#a3294d"},
{id:2,img:"p9.jpg",n:"Embroidered Lawn Collection",c:"Ladies",f:"Lawn",p:4990,o:5990,pc:"3 Piece",a:"#9fd3c7",b:"#2f7f73"},
{id:3,img:"p10.jpg",n:"Winter Khaddar Printed Suit",c:"Ladies",f:"Khaddar",p:3290,o:3790,pc:"3 Piece",a:"#b9a3d6",b:"#5b3f8c"},
{id:4,img:"p11.jpg",n:"Chiffon Embroidered Formal",c:"Ladies",f:"Chiffon",p:7490,o:8990,pc:"3 Piece",a:"#f1b7a6",b:"#b5472a"}
];
var cart=[];
var curFilter="All";
var curSlide=0;

function renderSlider(){
var s=document.getElementById('slider'); s.innerHTML='';
SLIDES.forEach((src,i)=>{
var d=document.createElement('div'); d.className='slide'+(i==0?' active':'');
d.innerHTML='<img src="'+src+'?'+IMG_VER+'" onerror="this.style.background=\'#e9ddd1\'" alt="slide">';
s.appendChild(d);
});
var dots=document.createElement('div'); dots.className='dots';
SLIDES.forEach((_,i)=>{
var dot=document.createElement('div'); dot.className='dot'+(i==0?' active':'');
dot.onclick=()=>goSlide(i); dots.appendChild(dot);
});
s.appendChild(dots);
setInterval(()=>goSlide((curSlide+1)%SLIDES.length),4000);
}
function goSlide(n){
curSlide=n;
document.querySelectorAll('.slide').forEach((el,i)=>el.classList.toggle('active',i==n));
document.querySelectorAll('.dot').forEach((el,i)=>el.classList.toggle('active',i==n));
}
function renderProducts(){
var g=document.getElementById('grid'); g.innerHTML='';
var list=P.filter(x=>curFilter=='All'||x.c==curFilter||x.f==curFilter);
list.forEach(p=>{
var el=document.createElement('div'); el.className='card';
el.innerHTML='<div class="pic"><span class="badge">SALE</span><img src="'+p.img+'?'+IMG_VER+'" alt="'+p.n+'" onerror="this.style.display=\'none\'"></div><div class="info"><div style="font-size:13px;color:#666">'+p.c+' • '+p.f+'</div><div style="font-weight:700;font-size:14px;line-height:1.3">'+p.n+'</div><div class="price">Rs '+p.p+' <s>Rs '+p.o+'</s></div><button class="btn" style="width:100%;margin-top:auto" onclick="addToCart('+p.id+')">Add to Cart</button></div>';
g.appendChild(el);
});
}
function setFilter(el,f){
curFilter=f;
document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
el.classList.add('active');
renderProducts();
}
function addToCart(id){
var item=cart.find(x=>x.id==id);
if(item) item.q++;
else { var prod=P.find(x=>x.id==id); cart.push({...prod,q:1}); }
updateCart();
openCart();
}
function updateCart(){
document.getElementById('cCount').innerText=cart.reduce((s,x)=>s+x.q,0);
document.getElementById('cItems').innerText=cart.reduce((s,x)=>s+x.q,0)+' items';
document.getElementById('cTotal').innerText='Rs '+cart.reduce((s,x)=>s+x.p*x.q,0);
var list=document.getElementById('cartList'); list.innerHTML='';
if(cart.length==0){ list.innerHTML='<p style="color:#777;text-align:center;padding:20px">Cart is empty</p>'; return; }
cart.forEach(c=>{
var r=document.createElement('div'); r.className='row';
r.innerHTML='<img src="'+c.img+'?'+IMG_VER+'" style="width:56px;height:68px;object-fit:cover;border-radius:8px"><div style="flex:1"><div style="font-weight:700;font-size:13px">'+c.n+'</div><div style="font-size:12px;color:#666">Rs '+c.p+' x '+c.q+'</div></div><button onclick="changeQ('+c.id+',-1)" class="btn ghost" style="padding:6px 10px">-</button><b style="padding:0 6px">'+c.q+'</b><button onclick="changeQ('+c.id+',1)" class="btn ghost" style="padding:6px 10px">+</button>';
list.appendChild(r);
});
}
function changeQ(id,d){
var it=cart.find(x=>x.id==id); if(!it) return;
it.q+=d; if(it.q<=0) cart=cart.filter(x=>x.id!=id);
updateCart();
}
function openCart(){ document.getElementById('cartModal').classList.add('open'); updateCart(); }
function closeCart(){ document.getElementById('cartModal').classList.remove('open'); }
function placeOrder(){
var name=document.getElementById('custName').value.trim();
var phone=document.getElementById('custPhone').value.trim();
var addr=document.getElementById('custAddr').value.trim();
if(cart.length==0){ alert('Cart empty'); return; }
if(!name||!phone||!addr){ alert('Please fill Name, Phone and Address'); return; }
var total=cart.reduce((s,x)=>s+x.p*x.q,0);
var msg='NEW ORDER - Muhammadi Cloth House%0A%0A';
msg+='Name: '+name+'%0APhone: '+phone+'%0AAddress: '+addr+'%0A%0A*Items:*%0A';
cart.forEach(c=>{ msg+=c.n+' - Rs '+c.p+' x '+c.q+' = Rs '+(c.p*c.q)+'%0A'; });
msg+='%0A*Total: Rs '+total+'*%0A%0ACash on Delivery';
var wa='923001234567';
window.open('https://wa.me/'+wa+'?text='+msg,'_blank');
}
renderSlider(); renderProducts(); updateCart();
</script>
</body>
</html>
